<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>VÖDÖR. PHONE</title>
  <link rel="preload" href="./gulfs-display-normal.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=20261117-vodor-phone">
</head>
<body class="phone-page">
  <h1>VÖDÖR. PHONE</h1>
  <main class="phone-art" aria-label="Interactive Vödör phone">
    <img src="./vodor-phone-art.png" alt="Illustration of the Vödör phone with social, location, music, gallery, booking and gift buttons">
    <div class="phone-screen" id="phoneScreen" aria-label="Vödör photo gallery"><img id="galleryPhoto" src="./gallery/photo-01.jpg" alt="Vödör sauna gallery photo"></div>
    <a class="phone-hit phone-mail-hit" id="emailButton" href="#emailDialog" aria-label="Show Vödör email address"></a>
    <a class="phone-hit phone-call-hit" href="mailto:info@vodorproject.hu" aria-label="Contact Vödör"></a>
    <a class="phone-hit phone-logo-hit" href="https://vodorproject.hu" aria-label="Back to vodorproject.hu"></a>
    <a class="phone-hit phone-exit-hit" href="./blank.html" aria-label="Exit"></a>
    <a class="phone-link phone-social-1" href="https://instagram.com/vodor.project" target="_blank" rel="noopener noreferrer" aria-label="Vödör on Instagram"></a>
    <a class="phone-link phone-social-2" href="https://www.facebook.com/profile.php?id=61594585125797&mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" aria-label="Vödör on Facebook"></a>
    <a class="phone-link phone-social-3" href="https://tiktok.com/@vodor.project" target="_blank" rel="noopener noreferrer" aria-label="Vödör on TikTok"></a>
    <a class="phone-link phone-grid-1" href="https://maps.app.goo.gl/MpBeVfA1G5aqymFW7" target="_blank" rel="noopener noreferrer" aria-label="Vödör location on Google Maps"></a>
    <a class="phone-link phone-grid-2" href="https://bazel.hu" target="_blank" rel="noopener noreferrer" aria-label="Bázel website"></a>
    <a class="phone-link phone-grid-3" href="https://maps.app.goo.gl/mu74ksGmQAbvaba28" target="_blank" rel="noopener noreferrer" aria-label="Vödör review on Google Maps"></a>
    <a class="phone-link phone-grid-4" href="https://open.spotify.com/playlist/1ZMPucKulnV0FybL6Jh0pu?si=9x_CsJiNS1qWGko_EL_u7g" target="_blank" rel="noopener noreferrer" aria-label="Vödör Spotify playlist"></a>
    <button class="phone-link phone-grid-5" id="galleryButton" type="button" aria-label="Play Vödör photo gallery"></button>
    <a class="phone-link phone-grid-6" href="./blank.html" aria-label="Exit"></a>
    <a class="phone-link phone-book-1" href="https://bookasession.org/vodor/bundles" target="_blank" rel="noopener noreferrer" aria-label="Buy a Vödör bundle"></a>
    <a class="phone-link phone-book-2" href="https://bookasession.org/vodor" target="_blank" rel="noopener noreferrer" aria-label="Book a Vödör session"></a>
    <a class="phone-link phone-book-3" href="https://bookasession.org/vodor/gift-vouchers" target="_blank" rel="noopener noreferrer" aria-label="Buy a Vödör gift card"></a>
  </main>
  <dialog class="phone-email-dialog" id="emailDialog"><p>VÖDÖR. EMAIL</p><a href="mailto:info@vodorproject.hu">info@vodorproject.hu</a><form method="dialog"><button>Close</button></form></dialog>
  <script>
    const galleryPhotos = Array.from({ length: 20 }, (_, index) => `./gallery/photo-${String(index + 1).padStart(2, "0")}.jpg`);
    const galleryImage = document.querySelector("#galleryPhoto");
    let galleryTimer;
    let currentPhoto = 0;
    document.querySelector("#emailButton").addEventListener("click", (event) => {
      event.preventDefault();
      document.querySelector("#emailDialog").showModal();
    });
    document.querySelector("#galleryButton").addEventListener("click", () => {
      if (galleryTimer) return;
      document.querySelector("#phoneScreen").style.display = "block";
      galleryImage.src = galleryPhotos[currentPhoto];
      galleryTimer = window.setInterval(() => {
        currentPhoto = (currentPhoto + 1) % galleryPhotos.length;
        galleryImage.src = galleryPhotos[currentPhoto];
      }, 3000);
    });
    document.querySelectorAll(".phone-exit-hit").forEach((button) => button.addEventListener("click", (event) => {
      event.preventDefault();
      window.close();
      window.location.href = "./blank.html";
    }));
  </script>
</body>
</html>
